services:
  mcp-server:
    build:
      context: .
    restart: unless-stopped
    environment:
      MCP_DATA_GW_HOST: 0.0.0.0
      MCP_DATA_GW_DATABASE_URL: sqlite:////app/data/${MCP_SERVER_DB}
    volumes:
      - mcp-gw-data:/app/data
      - mcp-gw-logs:/app/logs

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.19
    restart: unless-stopped

    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      MCP_STARTUP_WAIT_TIMEOUT: 60s

      LOG_LEVEL: info
      LOG_FORMAT: json

    depends_on:
      - mcp-server

volumes:
  mcp-gw-data:
  mcp-gw-logs:
